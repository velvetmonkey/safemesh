name: Documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pinned-source:
    name: Pinned Rust source consumer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recipe and checker
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Execute commands extracted from the docs with an empty Cargo home
        run: python3 scripts/check-pinned-source.py

  docs-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Read the Pages deployment address
        # Reads the repository's existing Pages configuration; enablement stays off,
        # so this never changes Pages settings.
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Derive the site address from the deployment
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: echo "SITE_URL=${PAGES_BASE_URL}/" >> "$GITHUB_ENV"
      - name: Set up Rust for the generated reference and the Lab
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master; toolchain selected below
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Cache Rust artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock', 'rust/**/*.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            web/package-lock.json
      - name: Install wasm-pack for the Lab
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --version 0.15.0 --locked
          fi
      - name: Install documentation and Lab dependencies
        run: |
          npm --prefix docs ci
          npm --prefix web ci
      - name: Run Rust and compiled TypeScript first-use fixtures and check documentation drift
        run: python3 scripts/check-gold-paths.py
      - name: Build documentation, search and the Lab at the deployment address
        run: npm --prefix docs run build:site
      - name: Crawl built pages, assets, anchors and external links
        timeout-minutes: 3
        run: python3 docs/check-links.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    needs: docs-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'velvetmonkey/safemesh'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
