name: SafeMesh CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  full-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache Lean toolchain and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            lean/.lake
          key: ${{ runner.os }}-lean-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json', 'lean/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-lean-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json') }}-
            ${{ runner.os }}-lean-

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e1648915a4fdfbb5afab579a8afeb8eba8f6528c # 1.96.1

      - name: Cache Rust artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock', 'rust/**/*.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean

      - name: Check Lean corpus freshness
        working-directory: lean
        run: |
          lake build corpus
          .lake/build/bin/corpus > "$RUNNER_TEMP/safemesh-corpus.json"
          diff -u --label committed/corpus.json --label regenerated/corpus.json \
            ../rust/crates/safemesh-crdt/tests/corpus.json "$RUNNER_TEMP/safemesh-corpus.json"

      - name: Install distribution tools
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --version 0.15.0 --locked
          fi
          if ! command -v cbindgen >/dev/null 2>&1; then
            cargo install cbindgen --version 0.28.0 --locked
          fi
          python3 -m pip install --user "maturin==1.14.1"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run full gate
        run: ./scripts/ci.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read declared MSRV
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\([^"]*\)"$/\1/p' rust/Cargo.toml | head -n1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install declared MSRV
        run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal

      - name: Test at declared MSRV
        run: cargo "+${{ steps.msrv.outputs.version }}" test --workspace --locked
