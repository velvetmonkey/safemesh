name: SafeMesh CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install declared Rust toolchain and Clippy
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$version" --profile minimal --component clippy
          rustup target add thumbv7em-none-eabihf wasm32-unknown-unknown x86_64-apple-darwin

      - name: Lint workspace and shipped configurations
        working-directory: rust
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p safemesh-crdt --all-targets --no-default-features --locked -- -D warnings
          cargo clippy -p safemesh-crdt --all-targets --features laws --locked -- -D warnings
          cargo clippy --workspace --all-targets --features "safemesh-crdt/laws safemesh-crdt/local-writer" --locked -- -D warnings
          cargo clippy -p safemesh-python --release --features extension-module --locked -- -D warnings
          cargo clippy -p safemesh-ffi --release --locked -- -D warnings
          cargo clippy -p safemesh-crdt --target thumbv7em-none-eabihf --locked -- -D warnings
          cargo clippy -p safemesh-wasm --release --target wasm32-unknown-unknown --locked -- -D warnings
          cargo clippy -p safemesh-crdt --features laws --all-targets --target x86_64-apple-darwin --locked -- -D warnings

  full-gate:
    # Keep the existing required check red even when its dependency fails.
    needs: [clippy, python]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require Clippy and Python success
        env:
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
        run: test "$CLIPPY_RESULT" = success && test "$PYTHON_RESULT" = success

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Bootstrap provenance verifies the generating commit is a HEAD ancestor.
          fetch-depth: 0

      - name: Check bootstrap file identities
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path("rust/crates/safemesh-crdt/tests")
          header = "file | package version | event-log frame version | payload schema version | durable wrapper version | details"
          # Retained bootstrap identities, documented in fixtures/bootstrap/README.md.
          # ABSENT is intentional; filenames and source versions are not identities.
          transaction = "ABSENT (unversioned three-field prefix)"
          expected = {
              "counter.log": ("0x03", "safemesh/gcounter-delta/v1", "ABSENT", ""),
              "counter.transaction": ("0x03", "safemesh/gcounter-delta/v1", transaction, "words=(2, 0, 1)"),
              "counter.fence": ("ABSENT", "ABSENT", "ABSENT", "ownership sidecar words=(2, 0, 1)"),
              "orset.log": ("0x03", "safemesh/orset-delta-utf8-u64/v1", "ABSENT", ""),
              "orset.transaction": ("0x03", "safemesh/orset-delta-utf8-u64/v1", transaction, "words=(2, 0, 2)"),
              "orset.fence": ("ABSENT", "ABSENT", "ABSENT", "ownership sidecar words=(2, 0, 1)"),
              "pn.log": ("0x03", "safemesh/pncounter-delta/v1", "ABSENT", ""),
              "gset.state": ("ABSENT", "ABSENT", "ABSENT", "state tag=0x20; schema identity not embedded"),
              "rga.state": ("ABSENT", "ABSENT", "ABSENT", "state tag=0x40; schema identity not embedded"),
          }
          failed = False
          for name, identity in expected.items():
              path = root / "fixtures/bootstrap" / name
              result = subprocess.run(
                  [sys.executable, str(root / "identity_probe.py"), str(path)],
                  capture_output=True, text=True,
              )
              print(result.stdout, end="")
              print(result.stderr, end="", file=sys.stderr)
              row = " | ".join((str(path), "ABSENT", *identity))
              if result.returncode != 0 or result.stdout.splitlines() != [header, row]:
                  print(f"{path}: identity probe failed (exit {result.returncode}); expected row: {row}", file=sys.stderr)
                  failed = True
          sys.exit(1 if failed else 0)

      - name: Install declared Rust floor
        id: floor
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("rust/Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')"
          rustup toolchain install "$version" --profile minimal
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cargo install wasm-pack --version 0.15.0 --locked

      - name: "FLOOR COMPILE: Build workspace and laws at declared Rust floor"
        working-directory: rust
        run: |
          if cargo "+${{ steps.floor.outputs.version }}" test --no-run --workspace --features "safemesh-crdt/laws safemesh-crdt/local-writer" --locked; then
            echo "FLOOR COMPILE passed: workspace and test executables built at the declared Rust floor." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=FLOOR COMPILE failure::Workspace or test compilation failed at the declared Rust floor; tests were not run."
            echo "FLOOR COMPILE failed: workspace or test compilation failed at the declared Rust floor; tests were not run." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: "FLOOR TEST: Test workspace and laws at declared Rust floor"
        working-directory: rust
        run: |
          if cargo "+${{ steps.floor.outputs.version }}" test --workspace --features "safemesh-crdt/laws safemesh-crdt/local-writer" --locked; then
            echo "FLOOR TEST passed: workspace and laws tests passed at the declared Rust floor." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=FLOOR TEST failure::The test command failed after the floor compile stage passed; inspect test and doctest results."
            echo "FLOOR TEST failed: the test command failed after the floor compile stage passed; inspect test and doctest results." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Cache Lean toolchain and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            lean/.lake
          key: ${{ runner.os }}-lean-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json', 'lean/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-lean-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json') }}-
            ${{ runner.os }}-lean-

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e1648915a4fdfbb5afab579a8afeb8eba8f6528c # 1.96.1
        with:
          components: rustfmt

      - name: Check laws on a non-Linux target
        working-directory: rust
        run: |
          rustup target add x86_64-apple-darwin
          cargo check -p safemesh-crdt --features laws --all-targets --target x86_64-apple-darwin --locked

      - name: Cache Rust artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock', 'rust/**/*.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean

      - name: Check Lean corpus freshness
        working-directory: lean
        run: |
          lake build corpus
          .lake/build/bin/corpus > "$RUNNER_TEMP/safemesh-corpus.json"
          diff -u --label committed/corpus.json --label regenerated/corpus.json \
            ../rust/crates/safemesh-crdt/tests/corpus.json "$RUNNER_TEMP/safemesh-corpus.json"

      - name: Install distribution tools
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --version 0.15.0 --locked
          fi
          if ! command -v cbindgen >/dev/null 2>&1; then
            cargo install cbindgen --version 0.28.0 --locked
          fi
          python3 -m pip install --user "maturin==1.14.1"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run full gate
        run: ./scripts/ci.sh

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # abi3-py38 is the declared floor; exercise every released minor through 3.14.
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e1648915a4fdfbb5afab579a8afeb8eba8f6528c # 1.96.1

      - name: Select binding test interpreter
        run: |
          echo "PYO3_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Test Python bindings
        working-directory: rust
        run: cargo test -p safemesh-python --locked

      - name: Build and install wheel
        run: |
          python -m pip install "maturin==1.14.1"
          python -m maturin build --manifest-path rust/crates/safemesh-python/Cargo.toml --release --locked --interpreter "$PYO3_PYTHON" --out "$RUNNER_TEMP/wheels"
          python -m pip install --no-index --find-links "$RUNNER_TEMP/wheels" safemesh-python

      - name: Test installed wheel
        run: |
          python rust/crates/safemesh-python/examples/data_mule_demo.py
          python demos/two-app-inventory/test_sync.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read declared MSRV
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\([^"]*\)"$/\1/p' rust/Cargo.toml | head -n1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install declared MSRV
        run: |
          rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Test at declared MSRV
        working-directory: rust
        run: cargo "+${{ steps.msrv.outputs.version }}" test --workspace --locked
