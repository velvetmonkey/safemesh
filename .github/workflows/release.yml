name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Require tag and exact source commit
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("rust/crates/safemesh-crdt/Cargo.toml", "rb"))["package"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
      - name: Require complete release notes for this tag
        run: python3 scripts/check-release-notes.py "$GITHUB_REF_NAME"
      - name: Require successful CI on this exact commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" > "$RUNNER_TEMP/ci-runs.json"
          jq -e --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .conclusion == "success")] | length > 0' "$RUNNER_TEMP/ci-runs.json"
      - name: Require a human reviewer for release publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/release-publish" > "$RUNNER_TEMP/release-environment.json"
          jq -e '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]? | select(.reviewer.login == "velvetmonkey")] | length > 0' "$RUNNER_TEMP/release-environment.json"
      - name: Refuse an already published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-state" 2> "$RUNNER_TEMP/release-error"; then
            test "$(cat "$RUNNER_TEMP/release-state")" = true
          else
            test "$(cat "$RUNNER_TEMP/release-error")" = 'release not found'
          fi

  build-assets:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e1648915a4fdfbb5afab579a8afeb8eba8f6528c # 1.96.1
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Install asset tools
        run: |
          python3 -m pip install 'maturin==1.14.1'
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN="$version"
          cargo install wasm-pack --version 0.15.0 --locked
      - name: Build assets and checksums
        run: bash scripts/build-release-assets.sh "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            ${{ runner.temp }}/release-assets/*.crate
            ${{ runner.temp }}/release-assets/*.whl
            ${{ runner.temp }}/release-assets/*.tgz
            ${{ runner.temp }}/release-assets/SHA256SUMS
          if-no-files-found: error

  draft:
    needs: build-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      - name: Create a draft from the checked assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release-assets"
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          # A retry refuses an existing draft instead of replacing its bytes.
          if gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/release-state" 2> "$RUNNER_TEMP/release-error"; then
            echo "REFUSE release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          test "$(cat "$RUNNER_TEMP/release-error")" = 'release not found'
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *rc* ]]; then prerelease+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" ./*.crate ./*.whl ./*.tgz SHA256SUMS \
            --draft --verify-tag "${prerelease[@]}" --title "SafeMesh $GITHUB_REF_NAME" \
            --notes-file "$GITHUB_WORKSPACE/docs/releases/$GITHUB_REF_NAME.md"

  verify-draft:
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub requires this to download draft assets.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: ${{ runner.temp }}/original
      - name: Download and verify the draft bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/draft"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/draft"
          cd "$RUNNER_TEMP/draft"
          cmp SHA256SUMS "$RUNNER_TEMP/original/SHA256SUMS"
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          while read -r digest name; do
            cmp "$name" "$RUNNER_TEMP/original/$name"
          done < SHA256SUMS
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
      - name: Check clean release installs
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/install-check-source"
          bash "$RUNNER_TEMP/install-check-source/scripts/check-release-install.sh" "$RUNNER_TEMP/draft"

  publish:
    needs: verify-draft
    environment: release-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish only the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release edit "$GITHUB_REF_NAME" --draft=false
