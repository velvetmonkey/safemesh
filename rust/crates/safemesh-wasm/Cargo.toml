[package]
name = "safemesh-wasm"
version = "0.2.2"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "WASM/TypeScript binding for the SafeMesh Rust core"
repository = "https://github.com/velvetmonkey/safemesh"
readme = "README.md"
keywords = ["crdt", "wasm", "event-log", "mesh"]
categories = ["wasm", "data-structures"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
safemesh-crdt = { path = "../safemesh-crdt", version = "0.2.2" }
wasm-bindgen = "0.2"
