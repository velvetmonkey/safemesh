[package]
name = "safemesh-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Thin C ABI spine for the SafeMesh Rust core"
repository = "https://github.com/velvetmonkey/safemesh"
readme = "README.md"
keywords = ["crdt", "ffi", "event-log", "mesh"]
categories = ["api-bindings", "data-structures"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
safemesh-crdt = { path = "../safemesh-crdt", version = "0.1.0" }
