[package]
name = "safemesh-ffi"
version = "1.0.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Thin C ABI spine for the SafeMesh Rust core"
repository = "https://github.com/velvetmonkey/safemesh"
readme = "README.md"
keywords = ["crdt", "ffi", "event-log", "mesh"]
categories = ["api-bindings", "data-structures"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
safemesh-crdt = { path = "../safemesh-crdt", version = "1.0.0" }
