[package]
name = "safemesh-python"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "PyO3/maturin binding for the SafeMesh Rust core"
repository = "https://github.com/velvetmonkey/safemesh"
readme = "README.md"
keywords = ["crdt", "python", "pyo3", "event-log", "mesh"]
categories = ["api-bindings", "data-structures"]

[lib]
name = "safemesh_python"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
# The wheel's stable-ABI reach starts at CPython 3.8.
pyo3 = { version = "0.22", features = ["abi3-py38"] }
safemesh-crdt = { path = "../safemesh-crdt", version = "0.1.0" }
