[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "safemesh-python"
version = "0.1.0"
description = "Python binding for the SafeMesh Rust core"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
keywords = ["crdt", "distributed-systems", "event-log", "safemesh"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Rust",
  "Operating System :: POSIX :: Linux",
]

[tool.maturin]
module-name = "safemesh_python"
bindings = "pyo3"
features = ["extension-module"]
