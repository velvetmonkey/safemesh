<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>SafeMesh Lab</title>
  <!-- purpose "any maskable": Android crops to a circle/squircle, so the glyph
       stays inside the centre 80 percent safe zone and the background bleeds
       to the full square. Background matches the manifest background_color. -->
  <rect width="512" height="512" fill="#f7f7f4"/>
  <g transform="translate(256 256) scale(5.2) translate(-32 -31)">
    <g stroke="#0d1c33" stroke-width="7" stroke-linecap="round">
      <path d="M32 31 14 31"/><path d="M32 31 47 15"/><path d="M32 31 46 47"/>
    </g>
    <g stroke="#0d1c33" stroke-width="4.5" stroke-linejoin="round">
      <circle cx="14" cy="31" r="7.5" fill="#2b8ce8"/>
      <circle cx="47" cy="15" r="8" fill="#2ad4f0"/>
      <circle cx="46" cy="47" r="7" fill="#24e3f6"/>
      <circle cx="32" cy="31" r="8" fill="#f2fbff"/>
    </g>
  </g>
</svg>
